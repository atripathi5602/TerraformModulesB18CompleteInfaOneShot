name: Terraform Infrastructure

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =====================================
  # TERRAFORM PLAN
  # =====================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
      || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"871cdac8-224e-46cb-abeb-1ece667f0a80","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"1c772b95-9b9e-4ee5-9460-35c59e50d89c","subscriptionId":"e4df100d-2d97-40dc-80ae-e7f0551dae43"}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./environment/prepod
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./environment/prepod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environment/prepod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environment/prepod
        run: terraform plan

  # =====================================
  # TERRAFORM APPLY
  # =====================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"871cdac8-224e-46cb-abeb-1ece667f0a80","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"1c772b95-9b9e-4ee5-9460-35c59e50d89c","subscriptionId":"e4df100d-2d97-40dc-80ae-e7f0551dae43"}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./environment/prepod
        run: terraform init

      - name: Terraform Apply hai
        working-directory: ./environment/prepod
        run: terraform apply -auto-approve
