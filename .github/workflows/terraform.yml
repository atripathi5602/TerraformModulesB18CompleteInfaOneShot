name: Terraform Infrastructure

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================
  # TERRAFORM PLAN
  # =========================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
      || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "9eac3105-2ec2-4f37-8b90-3d1d851fce11"
          client-secret: "W4V8Q~NmAomNOfMjBrTUT.rYDEUB8YgKRzAgduC"
          tenant-id: "0f7010fd-209e-4344-8457-043ffb37143b"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./terraformCode
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraformCode
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraformCode
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraformCode
        run: terraform plan

  # =========================
  # TERRAFORM APPLY
  # =========================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "9eac3105-2ec2-4f37-8b90-3d1d851fce11"
          client-secret: "W4V8Q~NmAomNOfMjBrTUT.rYDEUB8YgKRzAgduC"
          tenant-id: "0f7010fd-209e-4344-8457-043ffb37143b"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraformCode
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraformCode
        run: terraform apply -auto-approve
