name: Terraform Infrastructure

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "32bbe112-9f93-4dc7-a2ba-8c03c7457a55"
          tenant-id: "385e8e30-4e09-472e-9311-9c945c28dafc"
          subscription-id: "c9f80e6f-8188-4efe-a080-4474dc1aaea3"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./terraformCode
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraformCode
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraformCode
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraformCode
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Apply only after PR is merged into main
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true

    needs: terraform-plan

    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "32bbe112-9f93-4dc7-a2ba-8c03c7457a55"
          tenant-id: "385e8e30-4e09-472e-9311-9c945c28dafc"
          subscription-id: "c9f80e6f-8188-4efe-a080-4474dc1aaea3"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraformCode
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraformCode
        run: terraform apply -auto-approve
